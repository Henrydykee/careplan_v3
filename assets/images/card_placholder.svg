<svg width="48" height="32" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card base with rounded corners -->
  <rect width="48" height="32" rx="4" fill="#FF8C00" stroke="#E67300" stroke-width="0.5"/>
  
  <!-- EMV chip -->
  <rect x="6" y="14" width="8" height="6" rx="1" ry="1" fill="#FFD700" stroke="#E6C300" stroke-width="0.2"/>
  <line x1="7" y1="15" x2="13" y2="15" stroke="#E6C300" stroke-width="0.2"/>
  <line x1="7" y1="16" x2="13" y2="16" stroke="#E6C300" stroke-width="0.2"/>
  <line x1="7" y1="17" x2="13" y2="17" stroke="#E6C300" stroke-width="0.2"/>
  <line x1="7" y1="18" x2="13" y2="18" stroke="#E6C300" stroke-width="0.2"/>
  <line x1="7" y1="19" x2="13" y2="19" stroke="#E6C300" stroke-width="0.2"/>
  
  <!-- Contactless symbol -->
  <path d="M16 16 Q18 13, 20 16" stroke="#FFFFFF" stroke-width="0.5" fill="none"/>
  <path d="M15 16 Q18 11, 21 16" stroke="#FFFFFF" stroke-width="0.5" fill="none"/>
  <path d="M14 16 Q18 9, 22 16" stroke="#FFFFFF" stroke-width="0.5" fill="none"/>
  
  <!-- Credit card number placeholders -->
  <rect x="6" y="22" width="8" height="1.5" rx="0.5" ry="0.5" fill="#FFFFFF" opacity="0.7"/>
  <rect x="16" y="22" width="8" height="1.5" rx="0.5" ry="0.5" fill="#FFFFFF" opacity="0.7"/>
  <rect x="26" y="22" width="8" height="1.5" rx="0.5" ry="0.5" fill="#FFFFFF" opacity="0.7"/>
  <rect x="36" y="22" width="6" height="1.5" rx="0.5" ry="0.5" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Name and expiry placeholders -->
  <rect x="6" y="26" width="12" height="1.2" rx="0.5" ry="0.5" fill="#FFFFFF" opacity="0.7"/>
  <rect x="36" y="26" width="6" height="1.2" rx="0.5" ry="0.5" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Bank logo placeholder -->
  <rect x="6" y="5" width="12" height="4" rx="1" ry="1" fill="#FFFFFF" opacity="0.5"/>
  
  <!-- Hologram circle -->
  <circle cx="36" cy="16" r="3" fill="url(#hologram)"/>
  
  <!-- Gradient definition for hologram -->
  <defs>
    <linearGradient id="hologram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Magnetic stripe -->
  <rect x="0" y="4" width="48" height="5" fill="#333333"/>
</svg>